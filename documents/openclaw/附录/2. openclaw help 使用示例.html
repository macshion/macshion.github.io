          <h1 id="openclaw-help-使用示例"><a href="#openclaw-help-使用示例" class="headerlink" title="openclaw help 使用示例"></a><code>openclaw help</code> 使用示例</h1><figure class="highlight bash"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br><span class="line">8</span><br><span class="line">9</span><br><span class="line">10</span><br><span class="line">11</span><br><span class="line">12</span><br><span class="line">13</span><br><span class="line">14</span><br><span class="line">15</span><br><span class="line">16</span><br><span class="line">17</span><br><span class="line">18</span><br><span class="line">19</span><br><span class="line">20</span><br><span class="line">21</span><br><span class="line">22</span><br><span class="line">23</span><br><span class="line">24</span><br><span class="line">25</span><br><span class="line">26</span><br><span class="line">27</span><br><span class="line">28</span><br><span class="line">29</span><br><span class="line">30</span><br><span class="line">31</span><br><span class="line">32</span><br><span class="line">33</span><br><span class="line">34</span><br><span class="line">35</span><br><span class="line">36</span><br><span class="line">37</span><br><span class="line">38</span><br><span class="line">39</span><br><span class="line">40</span><br><span class="line">41</span><br><span class="line">42</span><br><span class="line">43</span><br><span class="line">44</span><br><span class="line">45</span><br><span class="line">46</span><br><span class="line">47</span><br><span class="line">48</span><br><span class="line">49</span><br><span class="line">50</span><br><span class="line">51</span><br><span class="line">52</span><br><span class="line">53</span><br><span class="line">54</span><br><span class="line">55</span><br><span class="line">56</span><br><span class="line">57</span><br><span class="line">58</span><br><span class="line">59</span><br><span class="line">60</span><br><span class="line">61</span><br><span class="line">62</span><br><span class="line">63</span><br></pre></td><td class="code"><pre><span class="line">openclaw models --<span class="built_in">help</span></span><br><span class="line"><span class="comment"># Show detailed help for the models command.</span></span><br><span class="line"><span class="comment"># 作用：查看 models 这组命令的详细帮助。</span></span><br><span class="line"><span class="comment"># 你可以把它理解为“专门查看模型相关功能说明”。</span></span><br><span class="line"><span class="comment"># 适用场景：你想了解 OpenClaw 怎么查看模型状态、配置模型、探测模型可用性时，用这个命令先看说明。</span></span><br><span class="line"><span class="comment"># 重点：它不会执行模型调用，只是打开帮助信息。</span></span><br><span class="line"></span><br><span class="line">openclaw channels login --verbose</span><br><span class="line"><span class="comment"># Link personal WhatsApp Web and show QR + connection logs.</span></span><br><span class="line"><span class="comment"># 作用：登录某个聊天渠道，并显示更详细的日志。</span></span><br><span class="line"><span class="comment"># 示例注释里写的是 WhatsApp Web，所以这里通常表示：把你的个人 WhatsApp Web 会话接入 OpenClaw，并在过程中显示更详细的连接日志。</span></span><br><span class="line"><span class="comment"># 适用场景：你想把 OpenClaw 接到聊天平台上，让它能通过聊天收发消息。</span></span><br><span class="line"><span class="comment"># 重点：--verbose 表示输出更详细的过程信息，方便排查登录失败或连接异常。</span></span><br><span class="line"></span><br><span class="line">openclaw message send --target +15555550123 --message <span class="string">&quot;Hi&quot;</span> --json</span><br><span class="line"><span class="comment"># Send via your web session and print JSON result.</span></span><br><span class="line"><span class="comment"># 作用：向指定目标发送一条消息，并将结果以 JSON 格式输出。</span></span><br><span class="line"><span class="comment"># 你可以把它理解为“测试消息发送是否成功，并把发送结果结构化打印出来”。</span></span><br><span class="line"><span class="comment"># 适用场景：你已经接好了某个聊天渠道，想验证 OpenClaw 是否真的能把消息发出去，同时希望看到更适合调试的结果格式。</span></span><br><span class="line"><span class="comment"># 重点：--json 表示输出结构化结果，便于程序读取、日志记录或后续排查。</span></span><br><span class="line"></span><br><span class="line">openclaw gateway --port 18789</span><br><span class="line"><span class="comment"># Run the WebSocket Gateway locally.</span></span><br><span class="line"><span class="comment"># 作用：在本地启动 Gateway，并指定端口为 18789。</span></span><br><span class="line"><span class="comment"># 你可以把它理解为“手动把 OpenClaw 的运行中枢启动起来，但不用默认端口，而是换一个端口运行”。</span></span><br><span class="line"><span class="comment"># 适用场景：默认端口被占用，或者你想明确控制 Gateway 运行在哪个端口。</span></span><br><span class="line"><span class="comment"># 重点：Gateway 是 OpenClaw 的核心运行服务，很多 agent、消息和自动化能力都依赖它。</span></span><br><span class="line"></span><br><span class="line">openclaw --dev gateway</span><br><span class="line"><span class="comment"># Run a dev Gateway (isolated state/config) on ws://127.0.0.1:19001.</span></span><br><span class="line"><span class="comment"># 作用：在 dev 开发环境下启动一个隔离的 Gateway。</span></span><br><span class="line"><span class="comment"># 你可以把它理解为“启动一个实验用的 OpenClaw 环境，不污染默认环境”。</span></span><br><span class="line"><span class="comment"># 适用场景：学习、测试配置、试错、排查问题时优先使用。</span></span><br><span class="line"><span class="comment"># 重点：--dev 会将家目录隔离到 ~/.openclaw-dev/，使用独立的配置、凭据、会话历史和日志，并运行在单独的端口上。</span></span><br><span class="line"><span class="comment">#       类似地，--profile &lt;name&gt; 会隔离到 ~/.openclaw-&lt;name&gt;/。两者都是学习阶段非常推荐的用法。</span></span><br><span class="line"></span><br><span class="line">openclaw gateway --force</span><br><span class="line"><span class="comment"># Kill anything bound to the default gateway port, then start it.</span></span><br><span class="line"><span class="comment"># 作用：强制启动 Gateway；如果默认端口已经被占用，会先清理占用该端口的进程，再启动 Gateway。</span></span><br><span class="line"><span class="comment"># 你可以把它理解为“端口冲突时的强制接管启动方式”。</span></span><br><span class="line"><span class="comment"># 适用场景：你之前启动过 Gateway 但没有正常关闭，或者默认端口被其他进程占用了。</span></span><br><span class="line"><span class="comment"># 重点：这是带有强制性的启动方式，适合排查端口冲突，但要注意不要误伤你本来需要的进程。</span></span><br><span class="line"></span><br><span class="line">openclaw gateway ...</span><br><span class="line"><span class="comment"># Gateway control via WebSocket.</span></span><br><span class="line"><span class="comment"># 作用：这里不是一条完整命令，而是在提示你 gateway 这组命令还有更多扩展用法。</span></span><br><span class="line"><span class="comment"># 你可以把它理解为“gateway 不只是一个启动命令，它还有更多通过 WebSocket 控制和管理 Gateway 的能力”。</span></span><br><span class="line"><span class="comment"># 适用场景：你已经知道如何启动 Gateway，接下来想进一步探索它的控制、查询或管理方式。</span></span><br><span class="line"><span class="comment"># 重点：看到这种省略号写法时，通常表示“请继续查看该命令组的详细帮助”。</span></span><br><span class="line"></span><br><span class="line">openclaw agent --to +15555550123 --message <span class="string">&quot;Run summary&quot;</span> --deliver</span><br><span class="line"><span class="comment"># Talk directly to the agent using the Gateway; optionally send the WhatsApp reply.</span></span><br><span class="line"><span class="comment"># 作用：通过 Gateway 直接向 agent 发送一条任务请求，并可选择把结果真正发送给指定目标。</span></span><br><span class="line"><span class="comment"># 你可以把它理解为“让 agent 执行一个任务，然后把执行结果发到聊天对象那里”。</span></span><br><span class="line"><span class="comment"># 适用场景：你已经接好了聊天渠道，想测试 agent 不只是生成内容，而是能把结果真正投递出去。</span></span><br><span class="line"><span class="comment"># 重点：--deliver 表示真的发送，不只是本地执行；如果没有这个参数，通常更偏测试或中间过程。</span></span><br><span class="line"></span><br><span class="line">openclaw message send --channel telegram --target @mychat --message <span class="string">&quot;Hi&quot;</span></span><br><span class="line"><span class="comment"># Send via your Telegram bot.</span></span><br><span class="line"><span class="comment"># 作用：通过 Telegram 渠道向指定目标发送一条消息。</span></span><br><span class="line"><span class="comment"># 你可以把它理解为“指定使用 Telegram 这个渠道，把消息发送给某个聊天对象”。</span></span><br><span class="line"><span class="comment"># 适用场景：你已经配置好了 Telegram bot，想测试消息发送是否正常。</span></span><br><span class="line"><span class="comment"># 重点：--channel telegram 明确指定了消息发送渠道，说明 OpenClaw 可以管理多个不同的聊天渠道，而不一定只依赖默认渠道。</span></span><br></pre></td></tr></table></figure>
